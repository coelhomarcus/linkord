name: Desktop installer

# Builds the Windows installer for one server, by hand from the Actions tab;
# Windows is the only system the app ships for. Nothing is signed
# (docs/DEPLOY.md, "Desktop app"), so the jobs need no secrets. With `release`
# it also becomes a draft GitHub release, which is where installed apps look
# for updates once it is published.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Address of the Linkord server the app opens (https, e.g. https://chat.example.com)
        type: string
        required: true
      release:
        description: Create a draft release v<desktop/package.json version> with the installer
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Package (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      # scripts/package.mjs refuses a missing or non-https address before
      # electron-builder runs; the input goes through env so it never becomes shell
      - name: Package
        run: npm run package --prefix desktop
        env:
          LINKORD_URL: ${{ inputs.url }}
          # the apps look for updates in this repository's releases
          LINKORD_UPDATE_REPO: ${{ github.repository }}
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: linkord-desktop-windows
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest*.yml

  release:
    name: Draft release
    needs: package
    if: inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: linkord-desktop-windows
          path: installers
      # Fails when the version already has a release: bump desktop/package.json first
      - name: Create draft release
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          gh release create "v$version" installers/* --draft --target "$GITHUB_SHA" \
            --title "Linkord desktop $version" \
            --notes "Linkord desktop $version for Windows.

          Download \`Linkord-$version-win-x64.exe\`. Installed versions update on their own."
        env:
          GH_TOKEN: ${{ github.token }}
