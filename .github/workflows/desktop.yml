name: Desktop installer

# Builds the Windows installer for one server, by hand from the Actions tab;
# Windows is the only system the app ships for. Nothing is signed
# (docs/DEPLOY.md, "Desktop app"), so the jobs need no secrets. With `release`
# it also becomes a draft GitHub release, which is where installed apps look
# for updates once it is published.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Address of the Overcord server the app opens (https, e.g. https://chat.example.com)
        type: string
        required: true
      release:
        description: Create a draft release v<desktop/package.json version> with the installer
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Package (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      # scripts/package.mjs refuses a missing or non-https address before
      # electron-builder runs; the input goes through env so it never becomes shell
      - name: Package
        run: npm run package --prefix desktop
        env:
          OVERCORD_URL: ${{ inputs.url }}
          # the apps look for updates in this repository's releases
          OVERCORD_UPDATE_REPO: ${{ github.repository }}
      - name: Verify release assets
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $installer = "desktop/release/Overcord-$version-win-x64.exe"
          $manifest = 'desktop/release/overcord.yml'
          $hash = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash $installer -Algorithm SHA512).Hash))
          if (-not (Select-String -Path $manifest -SimpleMatch "sha512: $hash" -Quiet)) {
            throw 'The update manifest does not match the installer'
          }
      - name: Install and launch Overcord on Windows
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $installer = Resolve-Path "desktop/release/Overcord-$version-win-x64.exe"
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $command = (Get-Item 'HKCU:\Software\Classes\overcord\shell\open\command').GetValue('')
          if ($command -notmatch '^"([^"]+\\Overcord\.exe)" "%1"$') {
            throw 'Overcord URL protocol does not point to the installed application'
          }
          $exe = $Matches[1]
          $feed = Join-Path (Split-Path $exe) 'resources/app-update.yml'
          if (-not (Select-String -Path $feed -Pattern '^channel: overcord$' -Quiet)) {
            throw 'The installed application does not use the Overcord update channel'
          }
          $app = Start-Process -FilePath $exe -PassThru
          if ($app.WaitForExit(8000)) { throw "Overcord exited with $($app.ExitCode) after launch" }
          Stop-Process -Id $app.Id
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: overcord-desktop-windows
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/overcord.yml

  release:
    name: Draft release
    needs: package
    if: inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: overcord-desktop-windows
          path: installers
      # Fails when the version already has a release: bump desktop/package.json first
      - name: Create draft release
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          gh release create "v$version" installers/* --draft --target "$GITHUB_SHA" \
            --title "Overcord desktop $version" \
            --notes "Overcord desktop $version for Windows.

          Download \`Overcord-$version-win-x64.exe\` to install Overcord. If you still have Linkord, uninstall it first, then sign in with your existing account."
        env:
          GH_TOKEN: ${{ github.token }}
