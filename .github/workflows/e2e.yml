name: E2E

# The Playwright suite against the production-shaped Docker stack. It takes
# minutes per project, so it runs where it guards a release: on pull requests
# into main (a deploy), and by hand from the Actions tab for any branch.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        description: Playwright project to run
        type: choice
        options: [all, features, restart, upgrade, split]
        default: features

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.project != 'all') && format('["{0}"]', inputs.project) || '["features","restart","upgrade","split"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the upgrade project builds the production version from origin/main
          fetch-depth: ${{ matrix.project == 'upgrade' && '0' || '1' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      # Playwright drives the runner image's Google Chrome (`channel: 'chrome'`)
      - run: bun install --frozen-lockfile --cwd e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Test
        run: bun run --cwd e2e test:${{ matrix.project }}
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.project }}
          path: |
            e2e/report
            e2e/test-results
          retention-days: 7
