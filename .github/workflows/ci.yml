name: CI

# The checks AGENTS.md asks for before calling a change done, split in four
# jobs that run side by side. None needs PostgreSQL: `.env.test` only satisfies
# the import guard of `server/src/db/client.ts`. The browser suite has its own
# workflow (e2e.yml).
on:
  push:
    branches: [main, develop]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck (production build)
        run: npm run build:server
      - name: Typecheck tests
        run: npm run typecheck:server:tests
      - name: Test
        run: npm run test:server

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Lint
        run: npm run lint --prefix web
      - name: Test
        run: npm run test --prefix web
      # `tsc -b` typechecks the app before `vite build`
      - name: Typecheck and build
        run: npm run build --prefix web

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Electron fetches its binary on first launch, which these steps never do
      - run: npm ci --prefix desktop
      - name: Typecheck
        run: npm run typecheck --prefix desktop
      - name: Test
        run: npm run test --prefix desktop

  hygiene:
    name: Audit and dead code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            e2e/package-lock.json
            desktop/package-lock.json
      - name: Audit shipped dependencies
        run: npm run check:audit
      # knip reads every workspace, so each needs its packages (Electron's own
      # binary is only fetched on first launch, which this job never does)
      - run: npm ci && npm ci --prefix web && npm ci --prefix e2e && npm ci --prefix desktop
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Dead code
        run: npm run check:dead-code
      - name: Typecheck e2e
        run: npm run typecheck --prefix e2e
