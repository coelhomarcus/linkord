name: CI

# The checks run in parallel. Only the integration job needs PostgreSQL.
# The browser suite has its own workflow (e2e.yml).
on:
  push:
    branches: [main, develop]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: '1.4.5'

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck (production build)
        run: bun run build:server
      - name: Typecheck tests
        run: bun run typecheck:server:tests
      - name: Test
        run: bun run test:server

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linkord
          POSTGRES_PASSWORD: linkord
          POSTGRES_DB: linkord
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U linkord -d linkord"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Run integration tests
        run: bun run test:integration
        env:
          DATABASE_URL: postgres://linkord:linkord@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/linkord

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --cwd web
      - name: Lint
        run: bun run --cwd web lint
      - name: Test
        run: bun run test:web
      # `tsc -b` typechecks the app before `vite build`
      - name: Typecheck and build
        run: bun run build:web

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Electron fetches its binary on first launch, which these steps never do
      - run: npm ci --prefix desktop
      - name: Typecheck
        run: npm run typecheck --prefix desktop
      - name: Test
        run: npm run test --prefix desktop

  hygiene:
    name: Audit and dead code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Audit shipped dependencies
        run: bun run check:audit
      # knip reads every workspace, so each needs its packages (Electron's own
      # binary is only fetched on first launch, which this job never does)
      - run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd web
          bun install --frozen-lockfile --cwd e2e
          npm ci --prefix desktop
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Dead code
        run: bun run check:dead-code
      - name: Typecheck e2e
        run: bun run --cwd e2e typecheck
