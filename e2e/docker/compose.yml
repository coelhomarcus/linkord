# The end-to-end stack: the app behind Traefik (as in production behind
# Dokploy), a LiveKit dev server, its own throwaway Postgres and a mail sink
# standing in for Resend. Driven by e2e/stack/stack.ts; never shares anything
# with the dev database.
name: overcord-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: overcord
      POSTGRES_PASSWORD: overcord
      POSTGRES_DB: overcord
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overcord -d overcord"]
      interval: 1s
      timeout: 3s
      retries: 30

  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # Receives the app's code emails (password recovery, two-step login) so specs
  # can read the codes back: GET http://localhost:8025/emails?to=<address>.
  mailsink:
    image: oven/bun:1.4.5-alpine
    command: ["bun", "--no-env-file", "/mailsink.mjs"]
    volumes:
      - ./mailsink.mjs:/mailsink.mjs:ro
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/healthz"]
      interval: 1s
      timeout: 3s
      retries: 30

  app:
    image: ${APP_IMAGE:?set APP_IMAGE}
    env_file: ../.e2e.env
    environment:
      DATABASE_URL: postgres://overcord:overcord@postgres:5432/overcord
      # Chrome resolves lk.localhost to the published port on the host.
      # The server uses Compose DNS for LiveKit's room management API.
      LIVEKIT_URL: ws://lk.localhost:7880
      LIVEKIT_SERVER_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LIVEKIT_ROOM_NAME: e2e
      APP_URL: http://localhost:8080
      COOKIE_SECURE: "0"
      REGISTRATIONS_PER_IP_PER_HOUR: "100000"
      MAX_NEW_ACCOUNTS_PER_HOUR: "100000"
      MAX_CONNECTIONS_PER_USER: "20"
      # every browser of the suite connects from the same address
      MAX_CONNECTIONS_PER_IP: "100000"
      # email goes to the mail sink above, never to Resend (a build that predates
      # RESEND_API_URL would call Resend, but no spec sends mail through one)
      RESEND_API_URL: http://mailsink:8025
      RESEND_API_KEY: e2e-not-a-real-key
      RESEND_FROM_EMAIL: Overcord <noreply@example.test>
    extra_hosts:
      # Older images under the upgrade test only read LIVEKIT_URL.
      - "lk.localhost:host-gateway"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: traefik:v3.3
    ports:
      - "8080:8080"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro

volumes:
  uploads:
