http:
  routers:
    linkord-backend:
      rule: 'Host(`localhost`) && (PathRegexp(`^/(api|ws|uploads)(/|$)`) || Path(`/healthz`) || Path(`/readyz`))'
      priority: 200
      entryPoints: [web]
      service: app
    linkord-frontend:
      rule: 'Host(`localhost`)'
      priority: 100
      entryPoints: [web]
      service: frontend
    linkord-admin-api:
      rule: 'Host(`127.0.0.1`) && (PathPrefix(`/api/admin/`) || Path(`/api/csp-reports`) || PathPrefix(`/uploads/`))'
      priority: 200
      entryPoints: [web]
      service: app
    linkord-admin-site:
      rule: 'Host(`127.0.0.1`)'
      priority: 100
      entryPoints: [web]
      service: admin
  services:
    app:
      loadBalancer:
        servers:
          - url: http://app:3000
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:8080
    admin:
      loadBalancer:
        servers:
          - url: http://admin:8080
