# A complete Linkord on one machine: Postgres, LiveKit, the app and a mail sink for the codes, for trying it
# out, developing against the real image, or a small single-server install. Production still deploys through
# Dokploy (docs/DEPLOY.md); the end-to-end suite has its own disposable stack (e2e/docker/compose.yml).
#
#   cp .env.full.example .env.full    # then fill in the required values
#   docker compose --env-file .env.full -f docker-compose.full.yml up -d --build
#
# The app answers on http://localhost:3000. Its port and LiveKit's signalling port are published on 127.0.0.1
# only: the image trusts X-Forwarded-For (TRUST_PROXY=1), which is safe only when nothing but a proxy or this
# machine can reach it. To serve other machines, use the `https` profile (Caddy) as docs/DEPLOY.md describes.
name: linkord

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.full and pass --env-file .env.full}
      POSTGRES_DB: linkord
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkord -d linkord"]
      interval: 5s
      timeout: 5s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env.full and pass --env-file .env.full}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env.full and pass --env-file .env.full}"
    volumes:
      - ./docker/full/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # signalling (WebSocket); behind Caddy in the `https` profile, so it never needs to be public
      - "127.0.0.1:7880:7880"
      # media: browsers send to LIVEKIT_NODE_IP on these, so a remote install publishes them on 0.0.0.0
      - "${LIVEKIT_RTC_BIND:-127.0.0.1}:7881:7881"
      - "${LIVEKIT_RTC_BIND:-127.0.0.1}:7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7880"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Prints the emails the app would send (recovery, two-step login codes) to its log. Unused once
  # RESEND_API_URL and RESEND_API_KEY point at the real Resend.
  mailsink:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/mailsink.mjs"]
    volumes:
      - ./docker/full/mailsink.mjs:/mailsink.mjs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.full
    environment:
      DATABASE_URL: postgres://linkord:${POSTGRES_PASSWORD}@postgres:5432/linkord
      REGISTRATION_CODE: ${REGISTRATION_CODE:?set REGISTRATION_CODE in .env.full and pass --env-file .env.full}
      # what browsers connect to; the server itself reaches LiveKit over the compose network
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_SERVER_URL: http://livekit:7880
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_healthy
      mailsink:
        condition: service_healthy
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # TLS in front of the app and LiveKit, for an install other machines reach: `--profile https`.
  # Needs APP_DOMAIN and LIVEKIT_DOMAIN pointing at this machine, and ports 80 and 443 open.
  caddy:
    profiles: ["https"]
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-}
    volumes:
      - ./docker/full/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      app:
        condition: service_healthy

  # Scheduled backups, off by default: `--profile backup`. One backup at start and then every
  # BACKUP_INTERVAL_SECONDS (default one day) into the `backups` volume, keeping the newest BACKUP_KEEP.
  # Copy them off this machine too; see docs/DEVELOPMENT.md#backup-and-restore.
  backup:
    profiles: ["backup"]
    build: .
    restart: unless-stopped
    env_file:
      - .env.full
    environment:
      DATABASE_URL: postgres://linkord:${POSTGRES_PASSWORD}@postgres:5432/linkord
    volumes:
      - uploads:/app/uploads:ro
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - sh
      - -c
      - 'while true; do node server/dist/scripts/backup.js || echo "backup failed" >&2; sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"; done'

volumes:
  postgres_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
