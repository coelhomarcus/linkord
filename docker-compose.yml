# No reverse proxy/SSL here — in production this runs behind Dokploy, which
# already has its own Traefik + automatic certificates.

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    mem_reservation: 512m

  # Scheduled backups, off by default: `docker compose --profile backup up -d backup`.
  # One backup at start and then every BACKUP_INTERVAL_SECONDS (default one day) into ./backups,
  # keeping the newest BACKUP_KEEP. Copy ./backups off this machine too; see docs/DEVELOPMENT.md#backup-and-restore.
  backup:
    profiles: ["backup"]
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads:ro
      - ./backups:/app/backups
    healthcheck:
      disable: true
    command:
      - sh
      - -c
      - 'while true; do node server/dist/scripts/backup.js || echo "backup failed" >&2; sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"; done'
