<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Linkord</title>
    <meta name="description" content="Chat, chamadas de voz e vídeo e compartilhamento de tela em tempo real." />
    <script>
      (function () {
        var language = (localStorage.getItem('ss-locale') || navigator.language || '').toLowerCase().startsWith('en') ? 'en-US' : 'pt-BR';
        document.documentElement.lang = language;
        document.title = language === 'en-US' ? 'Linkord' : 'Linkord';
      }());
    </script>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <script>
      (function () {
        var key = 'linkord.colorTheme';
        var raw = localStorage.getItem(key);
        var shells = { black: '#000000', old: '#0d0d0f', graphite: '#202225' };
        // Ids stored before the rename; keep in step with LEGACY_COLOR_THEME_IDS
        // in useColorThemePreference.ts.
        var legacy = { linkord: 'old', discord: 'graphite' };
        if (Object.prototype.hasOwnProperty.call(legacy, raw)) {
          raw = legacy[raw];
          try { localStorage.setItem(key, raw); } catch (e) {}
        }
        var id = Object.prototype.hasOwnProperty.call(shells, raw) ? raw : 'black';
        document.documentElement.dataset.theme = id;
        var bg = shells[id];
        // A stylesheet, not an attribute: the app's own CSS must be able to
        // override it. The text is exactly `html,body{background:` + one shells
        // color + `}`; the server hashes each of those into style-src-elem.
        var style = document.createElement('style');
        style.textContent = 'html,body{background:' + bg + '}';
        document.head.appendChild(style);
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS takes the home-screen icon and name from these, not from the manifest -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Linkord" />
    <meta name="application-name" content="Linkord" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
