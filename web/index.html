<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Linkord</title>
    <meta name="description" content="Chat, chamadas de voz e vídeo e compartilhamento de tela em tempo real." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <script>
      (function () {
        var key = 'linkord.colorTheme';
        var raw = localStorage.getItem(key);
        var shells = { black: '#000000', linkord: '#0d0d0f', discord: '#202225' };
        var id = Object.prototype.hasOwnProperty.call(shells, raw) ? raw : 'black';
        document.documentElement.dataset.theme = id;
        var bg = shells[id];
        var style = document.createElement('style');
        style.textContent = 'html,body{background:' + bg + '}';
        document.head.appendChild(style);
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS takes the home-screen icon and name from these, not from the manifest -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Linkord" />
    <meta name="application-name" content="Linkord" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
