<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Overcord</title>
    <meta name="description" content="Chat, chamadas de voz e vídeo e compartilhamento de tela em tempo real." />
    <script>
      (function () {
        var language = (localStorage.getItem('ss-locale') || navigator.language || '').toLowerCase().startsWith('en') ? 'en-US' : 'pt-BR';
        document.documentElement.lang = language;
        // Carry browser preferences forward when an existing origin changes brand.
        try {
          ['preferences', 'preferencesOwner', 'colorTheme', 'density', 'textSize', 'font'].forEach(function (name) {
            var oldKey = 'linkord.' + name;
            var key = 'overcord.' + name;
            var stored = localStorage.getItem(oldKey);
            if (stored === null) return;
            if (localStorage.getItem(key) === null) localStorage.setItem(key, stored);
            localStorage.removeItem(oldKey);
          });
        } catch (e) {}
      }());
    </script>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <script>
      (function () {
        var key = 'overcord.colorTheme';
        var raw = localStorage.getItem(key);
        var shells = { black: '#000000', old: '#0d0d0f', graphite: '#202225', latte: '#dce0e8', frappe: '#232634', macchiato: '#181926', mocha: '#11111b' };
        // Ids stored before the rename; keep in step with LEGACY_COLOR_THEME_IDS
        // in useColorThemePreference.ts.
        var legacy = { linkord: 'old', discord: 'graphite' };
        if (Object.prototype.hasOwnProperty.call(legacy, raw)) {
          raw = legacy[raw];
          try { localStorage.setItem(key, raw); } catch (e) {}
        }
        var id = Object.prototype.hasOwnProperty.call(shells, raw) ? raw : 'black';
        document.documentElement.dataset.theme = id;
        var bg = shells[id];
        // A stylesheet, not an attribute: the app's own CSS must be able to
        // override it. The text is exactly `html,body{background:` + one shells
        // color + `}`; the server hashes each of those into style-src-elem.
        var style = document.createElement('style');
        style.textContent = 'html,body{background:' + bg + '}';
        document.head.appendChild(style);
      })();
    </script>
    <script>
      (function () {
        // Density, text size and font, set before the first paint so the page
        // never lays out at the defaults first. Keep in step with
        // appearancePreferences.ts; a default value has no attribute.
        var prefs = [
          ['overcord.density', 'density', ['compact', 'comfortable']],
          ['overcord.textSize', 'textSize', ['small', 'large', 'larger']],
          ['overcord.font', 'font', ['system']]
        ];
        var root = document.documentElement;
        for (var i = 0; i < prefs.length; i++) {
          var raw = null;
          try { raw = localStorage.getItem(prefs[i][0]); } catch (e) {}
          if (prefs[i][2].indexOf(raw) !== -1) root.dataset[prefs[i][1]] = raw;
        }
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS takes the home-screen icon and name from these, not from the manifest -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Overcord" />
    <meta name="application-name" content="Overcord" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
