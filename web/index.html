<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Linkord</title>
    <meta name="description" content="Linkord: compartilhamento de tela e chat em tempo real, sem cadastro e sem link." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d0d0f" />
    <script>
      (function () {
        var key = 'linkord.colorTheme';
        var raw = localStorage.getItem(key);
        var id = raw === 'whatsapp' || raw === 'discord' ? raw : 'linkord';
        document.documentElement.dataset.theme = id;
        var bg = id === 'whatsapp' ? '#111b21' : id === 'discord' ? '#202225' : '#0d0d0f';
        var style = document.createElement('style');
        style.textContent = 'html,body{background:' + bg + '}';
        document.head.appendChild(style);
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
