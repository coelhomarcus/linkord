<!-- Monochrome chain-link. Tile and glyph flip with the browser chrome
     so a light tab bar does not get a black square. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .tile { fill: #111113; }
    .mark { fill: #f4f4f5; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #f4f4f5; }
      .mark { fill: #111113; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="8"/>
  <g transform="rotate(-28 16 16)">
    <path
      class="mark"
      fill-rule="evenodd"
      d="M9.6 11h12.8a5 5 0 0 1 5 5 5 5 0 0 1-5 5H9.6a5 5 0 0 1-5-5 5 5 0 0 1 5-5Zm2.3 3.5h8.2a1.8 1.8 0 0 1 0 3.6h-8.2a1.8 1.8 0 0 1 0-3.6Z"
    />
  </g>
</svg>
