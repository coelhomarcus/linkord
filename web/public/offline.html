<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Linkord — sem conexão</title>
    <!-- self-contained on purpose: shown by the service worker with no network, so it can load nothing else -->
    <style>
      html, body { height: 100%; margin: 0; background: #000; color: #f4f4f5; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center;
      }
      main { max-width: 22rem; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      svg { width: 64px; height: 64px; }
      h1 { margin: 8px 0 0; font-size: 1.25rem; font-weight: 600; }
      p { margin: 0; color: #a1a1aa; font-size: 0.9375rem; line-height: 1.5; }
      button {
        margin-top: 8px; padding: 10px 18px; border: 0; border-radius: 8px; cursor: pointer;
        background: #5865f2; color: #fff; font: inherit; font-weight: 600;
      }
      button:hover { background: #4752c4; }
      button:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#111113" />
        <g transform="translate(16 16) scale(0.86) translate(-16 -16) rotate(-28 16 16)">
          <path fill="#f4f4f5" fill-rule="evenodd" d="M9 10h14a6 6 0 0 1 6 6v0a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6 6 6 0 0 1 6-6Zm2.6 4.15h8.8a2.15 2.15 0 0 1 0 4.3h-8.8a2.15 2.15 0 0 1 0-4.3Z" />
        </g>
      </svg>
      <h1>Sem conexão</h1>
      <p>O Linkord precisa de internet para funcionar. Confira sua conexão e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>
      // back online: no need to wait for a click
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
