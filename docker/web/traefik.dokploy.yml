# Substitute the public hostname and the two Dokploy service names before installing this file.
http:
  routers:
    linkord-split-redirect:
      rule: 'Host(`__APP_DOMAIN__`)'
      priority: 100
      entryPoints: [web]
      middlewares: [redirect-to-https@file]
      service: linkord-web
    linkord-split-backend:
      rule: 'Host(`__APP_DOMAIN__`) && (PathRegexp(`^/(api|ws|uploads)(/|$)`) || Path(`/healthz`) || Path(`/readyz`))'
      priority: 200
      entryPoints: [websecure]
      service: linkord-backend
    linkord-split-frontend:
      rule: 'Host(`__APP_DOMAIN__`)'
      priority: 100
      entryPoints: [websecure]
      service: linkord-web
  services:
    linkord-backend:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://__BACKEND_APP_NAME__:3000
    linkord-web:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://__FRONTEND_APP_NAME__:8080
