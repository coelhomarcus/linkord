map $uri $linkord_cache_control {
    default "public, max-age=3600";
    ~^/assets/ "public, max-age=31536000, immutable";
    /sw.js "private, no-cache, no-store, max-age=0";
    ~\.html$ "no-cache";
}

server {
    listen 8080;
    root /usr/share/nginx/linkord;
    server_tokens off;

    include /etc/nginx/security-headers.conf;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $linkord_cache_control;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css;

    location = / {
        rewrite ^ /index.html last;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    # The edge routes these to Fastify. An invalid upstream rule must not
    # turn an API or Socket.IO error into a successful HTML response.
    location ~ ^/(?:(?:api|ws|uploads)(?:/|$)|(?:healthz|readyz)$) {
        return 404;
    }

    location / {
        try_files $uri @spa;
    }

    location @spa {
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        if ($uri ~ "\.[^/]+$") { return 404; }
        rewrite ^ /index.html last;
    }
}
