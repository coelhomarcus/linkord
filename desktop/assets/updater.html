<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The updater window (src/main/updaterWindow.ts). It shows what the main
     process sends and loads nothing from anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Linkord</title>
<style>
  :root {
    color-scheme: dark;
    --surface: oklch(19.5% 0.004 275);
    --text: oklch(95% 0.002 279.3);
    --muted: oklch(71% 0.002 279.3);
    --accent: oklch(55% 0.15 248);
    --accent-hover: oklch(60% 0.15 248);
    --track: oklch(30% 0.004 275);
    --control: oklch(100% 0 0 / 0.07);
    --control-hover: oklch(100% 0 0 / 0.11);
    --success: oklch(72% 0.17 150);
    --danger: oklch(74% 0.14 27.69);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--surface); }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 24px 24px; text-align: center;
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-font-smoothing: antialiased;
    /* frameless: the whole window drags it, as a title bar would */
    -webkit-app-region: drag;
  }
  .logo { width: 88px; height: 88px; margin-bottom: 28px; animation: breathe 2.4s ease-in-out infinite; }
  [data-tone="success"] .logo, [data-tone="error"] .logo { animation: none; }
  @keyframes breathe { 50% { transform: scale(0.93); } }
  .title { font-size: 15px; font-weight: 600; min-height: 21px; }
  [data-tone="success"] .title { color: var(--success); }
  [data-tone="error"] .title { color: var(--danger); }
  .detail { margin-top: 4px; color: var(--muted); font-size: 12px; min-height: 17px; font-variant-numeric: tabular-nums; }
  .countdown { margin-top: 2px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .countdown:empty { display: none; }
  .bar { position: relative; width: 180px; height: 6px; margin-top: 16px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar[hidden] { display: block; visibility: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: var(--accent); transition: width 200ms var(--ease-out); }
  .bar.indeterminate .fill { width: 40%; animation: slide 1.2s ease-in-out infinite; transition: none; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .actions { display: flex; gap: 8px; margin-top: 18px; min-height: 32px; -webkit-app-region: no-drag; }
  button {
    height: 32px; padding: 0 14px; border: 0; border-radius: 6px; font: inherit; font-weight: 500;
    color: var(--text); background: var(--control); cursor: default; outline: none; transition: background-color 100ms;
  }
  button:hover { background: var(--control-hover); }
  button:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  button.primary { background: var(--accent); color: white; }
  button.primary:hover { background: var(--accent-hover); }
  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
    .bar.indeterminate .fill { animation: none; width: 100%; opacity: 0.5; }
  }
</style>
</head>
<body data-tone="neutral">

<div role="status" aria-live="polite">
  <div class="title" id="title"></div>
  <div class="detail" id="detail"></div>
</div>
<div class="countdown" id="countdown"></div>
<div class="bar" id="bar" hidden><div class="fill" id="fill"></div></div>
<div class="actions" id="actions"></div>
<script>
  const bar = document.getElementById('bar');
  const fill = document.getElementById('fill');
  const actions = document.getElementById('actions');
  let shownActions = '';
  let dismissable = false;
  // Replacing a live region's text with the same words would read them out again every second
  const setText = (id, text) => {
    const element = document.getElementById(id);
    if (element.textContent !== text) element.textContent = text;
  };

  function render(view) {
    document.body.dataset.tone = view.tone;
    setText('title', view.title);
    setText('detail', view.detail);
    const hasBar = view.progress !== undefined;
    bar.hidden = !hasBar;
    bar.classList.toggle('indeterminate', view.progress === null);
    fill.style.width = typeof view.progress === 'number' ? view.progress + '%' : '';
    setText('countdown', view.countdown ?? '');
    dismissable = view.actions.some((action) => action.id === 'later');
    // A countdown redraws every second: rebuilding the same buttons would drop their hover and focus
    const nextActions = JSON.stringify(view.actions);
    if (nextActions === shownActions) return;
    shownActions = nextActions;
    actions.replaceChildren(...view.actions.map((action) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = action.label;
      if (action.primary) button.className = 'primary';
      button.addEventListener('click', () => window.linkordUpdater?.act(action.id));
      return button;
    }));
    actions.querySelector('.primary')?.focus();
  }

  window.linkordUpdater?.onRender(render);
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && dismissable) window.linkordUpdater?.act('later');
  });
</script>
</body>
</html>
