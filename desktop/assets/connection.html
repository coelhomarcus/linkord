<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Shown in the main window while the app's page is not there: the server is
     being reached or did not answer, or the page crashed too many times in a
     row (src/main/mainWindow.ts, connectionScreen.ts). It shows what the main
     process sends and loads nothing from anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Linkord</title>
<style>
  :root {
    color-scheme: dark;
    /* the main window's background (mainWindow.ts), as the app's page paints it */
    --background: #000000;
    --text: oklch(95% 0.002 279.3);
    --muted: oklch(71% 0.002 279.3);
    --faint: oklch(55% 0.002 279.3);
    --accent: oklch(55% 0.15 248);
    --accent-hover: oklch(60% 0.15 248);
    --track: oklch(30% 0.004 275);
    --control: oklch(100% 0 0 / 0.07);
    --control-hover: oklch(100% 0 0 / 0.11);
    --control-active: oklch(100% 0 0 / 0.15);
    --danger: oklch(74% 0.14 27.69);
    --title-bar: 32px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--background); }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-font-smoothing: antialiased;
    /* the window has no system title bar and the app's page, which draws one,
       is not there: the whole screen drags it */
    -webkit-app-region: drag;
  }
  .logo { width: 88px; height: 88px; margin-bottom: 28px; animation: breathe 2.4s ease-in-out infinite; }
  [data-tone="error"] .logo { animation: none; opacity: 0.6; }
  @keyframes breathe { 50% { transform: scale(0.93); } }
  .title { font-size: 15px; font-weight: 600; min-height: 21px; }
  [data-tone="error"] .title { color: var(--danger); }
  .detail { margin-top: 4px; color: var(--muted); font-size: 12px; min-height: 17px; }
  /* the bar and the countdown take turns in the same place, so nothing moves */
  .slot { display: flex; align-items: center; justify-content: center; height: 22px; margin-top: 10px; }
  .bar { position: relative; width: 180px; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar[hidden], .countdown:empty { display: none; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; background: var(--accent); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .countdown { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; margin-top: 12px; min-height: 32px; -webkit-app-region: no-drag; }
  .actions:empty { -webkit-app-region: drag; }
  .actions button {
    height: 32px; padding: 0 14px; border: 0; border-radius: 6px; font: inherit; font-weight: 500;
    color: white; background: var(--accent); cursor: default; outline: none; transition: background-color 100ms;
  }
  .actions button:hover { background: var(--accent-hover); }
  .actions button:focus-visible { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--accent); }

  /* Windows and Linux: the window's buttons, as the app's page draws them
     (web/src/app/layout/WindowControls.tsx). macOS keeps its traffic lights. */
  .controls { position: fixed; top: 0; right: 0; display: flex; height: var(--title-bar); -webkit-app-region: no-drag; }
  .controls:empty { display: none; }
  .controls button {
    display: flex; align-items: center; justify-content: center; padding: 0; border: 0;
    color: var(--text); background: transparent; cursor: default; outline: none; transition: background-color 100ms;
  }
  .controls button:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .controls[data-style="windows"] button { width: 46px; height: 100%; }
  .controls[data-style="windows"] button:hover { background: var(--control-hover); }
  .controls[data-style="windows"] button[data-kind="close"]:hover { background: #c42b1c; color: white; }
  .controls[data-style="linux"] { align-items: center; gap: 8px; padding: 0 8px; }
  .controls[data-style="linux"] button { width: 24px; height: 24px; border-radius: 50%; background: var(--control); }
  .controls[data-style="linux"] button:hover { background: var(--control-hover); }
  .controls[data-style="linux"] button:active { background: var(--control-active); }
  .controls[data-style="linux"] button:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
    .fill { animation: none; width: 100%; opacity: 0.5; }
  }
</style>
</head>
<body data-tone="neutral">
<div class="controls" id="controls" role="group"></div>
<svg class="logo" viewBox="117.5 118 1020 1020" aria-hidden="true"><g fill="#2b99e7"><path fill-rule="evenodd" clip-rule="evenodd" d="M508.2 396.1C497.5 387.5 474.9 243.3 426.5 242C362.7 240.4 202.7 317.3 179.2 379.3C165.8 414.8 180.7 463.1 197.6 494.9C239 573 293.4 446.2 314.3 418.3C358.4 359.1 369.4 411 371 428.2C371.3 432.2 369.9 433.9 366.4 435.9C246.5 505.6 203.7 612.9 198.8 747.3C198.7 750.8 197.2 752.9 193.7 753.2C178.2 754.5 160.8 744.9 144.4 748.7C99.9 759.1 153.9 823.4 166 847.2C167.6 850.4 166.8 853.2 163.7 854.8C150.6 861.4 130.2 862.6 157.9 902C199.8 961.6 275.4 1012 350 1013.5C358.7 1013.7 372.8 1011.5 377.8 1003.4C385.6 990.5 373.9 977.5 371.3 965.2C370.8 962.8 373.4 961.1 375.6 962C500.1 1010.1 566 1012.6 626.5 1012.6C687 1012.6 752.9 1010.1 877.4 962C879.6 961.1 882.2 962.8 881.7 965.2C879.1 977.5 867.4 990.5 875.2 1003.4C880.2 1011.5 894.3 1013.7 903 1013.5C977.6 1012 1053.2 961.6 1095.1 902C1122.8 862.6 1102.4 861.4 1089.3 854.8C1086.2 853.2 1085.4 850.4 1087 847.2C1099.1 823.4 1153.1 759.1 1108.6 748.7C1092.2 744.9 1074.8 754.5 1059.3 753.2C1055.8 752.9 1054.3 750.8 1054.2 747.2C1049.2 612.9 1006.4 505.5 886.5 435.9C883.1 433.9 881.7 432.2 882 428.2C883.6 411 894.6 359.1 938.7 418.3C959.6 446.2 1014 573 1055.4 494.9C1072.3 463.1 1087.2 414.8 1073.8 379.3C1050.3 317.3 890.3 240.4 826.5 242C781.9 243.2 759.2 366 747.5 391.8C746.4 394.2 743.2 394.2 741.6 392.1C727.7 374.8 707.6 349.5 690 343C679 339.3 673.9 353.3 672 371C671.7 373.1 669.2 374.2 667.5 372.9C637.4 348.6 596.6 311.3 566 296C552 291 543 310 538 345C536.3 362.5 538.3 376.1 537.9 387.9C537.7 391.8 536.4 393.6 532.8 394.8C525 397.4 512.7 399.7 508.2 396.1Z M446 615C484.2 615 518 667.8 518 735C518 790.9 487 833 446 833C405 833 374 790.9 374 735C374 667.8 407.8 615 446 615Z M807 615C845.2 615 879 667.8 879 735C879 790.9 848 833 807 833C766 833 735 790.9 735 735C735 667.8 768.8 615 807 615Z"/></g></svg>
<div role="status" aria-live="polite">
  <div class="title" id="title"></div>
  <div class="detail" id="detail"></div>
</div>
<!-- outside the live region: a countdown read out every second would drown everything else -->
<div class="slot">
  <div class="bar" id="bar" hidden><div class="fill"></div></div>
  <div class="countdown" id="countdown"></div>
</div>
<div class="actions" id="actions"></div>
<script>
  const SVG = 'http://www.w3.org/2000/svg';
  // web/src/app/layout/WindowControls.tsx's glyphs: Windows 11's and GNOME's
  const GLYPHS = {
    windows: {
      size: 10, stroke: 1, cap: 'butt',
      minimize: ['M0 5.5h10'],
      maximize: ['M1.5 0.5h7a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z'],
      restore: ['M1.5 2.5h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1z', 'M2.5 2.5V1.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-1'],
      close: ['M0.5 0.5l9 9M9.5 0.5l-9 9'],
    },
    linux: {
      size: 16, stroke: 1.5, cap: 'round',
      minimize: ['M4.75 11h6.5'],
      maximize: ['M5.75 4.75h4.5a1 1 0 0 1 1 1v4.5a1 1 0 0 1-1 1h-4.5a1 1 0 0 1-1-1v-4.5a1 1 0 0 1 1-1z'],
      restore: ['M5.75 6.25h3a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1z', 'M6.75 4.75h3.5a1 1 0 0 1 1 1v3.5'],
      close: ['M5 5l6 6M11 5l-6 6'],
    },
  };
  const bridge = window.linkordConnection;
  const el = (id) => document.getElementById(id);
  const drawn = { actions: '', controls: '' };

  // Only what changed, so the live region speaks once per change
  function setText(id, text) {
    const node = el(id);
    if (node.textContent !== text) node.textContent = text;
  }

  function glyph(set, name) {
    const svg = document.createElementNS(SVG, 'svg');
    svg.setAttribute('width', set.size);
    svg.setAttribute('height', set.size);
    svg.setAttribute('viewBox', `0 0 ${set.size} ${set.size}`);
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', set.stroke);
    svg.setAttribute('stroke-linecap', set.cap);
    svg.setAttribute('stroke-linejoin', set.cap === 'round' ? 'round' : 'miter');
    svg.setAttribute('aria-hidden', 'true');
    for (const d of set[name]) {
      const path = document.createElementNS(SVG, 'path');
      path.setAttribute('d', d);
      svg.append(path);
    }
    return svg;
  }

  function renderControls(controls) {
    const key = JSON.stringify(controls);
    if (key === drawn.controls) return;
    drawn.controls = key;
    const group = el('controls');
    if (!controls) { group.replaceChildren(); return; }
    const set = GLYPHS[controls.style] ?? GLYPHS.linux;
    group.dataset.style = controls.style;
    group.setAttribute('aria-label', controls.group);
    const buttons = [
      ['minimize', controls.minimize, 'minimize', 'minimize'],
      ['maximize', controls.maximize, controls.maximized ? 'restore' : 'maximize', 'toggle-maximize'],
      ['close', controls.close, 'close', 'close'],
    ];
    group.replaceChildren(...buttons.map(([kind, label, icon, action]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.kind = kind;
      button.title = label;
      button.setAttribute('aria-label', label);
      button.append(glyph(set, icon));
      button.addEventListener('click', () => bridge?.act(action));
      return button;
    }));
  }

  function render(view) {
    document.body.dataset.tone = view.tone;
    setText('title', view.title);
    setText('detail', view.detail);
    setText('countdown', view.countdown);
    el('bar').hidden = !view.busy;
    const actions = JSON.stringify(view.actions);
    if (actions !== drawn.actions) {
      drawn.actions = actions;
      el('actions').replaceChildren(...view.actions.map((action) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = action.label;
        button.addEventListener('click', () => bridge?.act(action.id));
        return button;
      }));
      el('actions').querySelector('button')?.focus();
    }
    renderControls(view.windowControls);
  }

  bridge?.onRender(render);
</script>
</body>
</html>
