<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The drawn tray menu on Windows (src/main/trayMenuWindow.ts). It shows
     what the main process sends and loads nothing from anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Overcord</title>
<style>
  :root {
    color-scheme: dark;
    --surface: oklch(19.5% 0.004 275);
    --border: oklch(100% 0 0 / 0.10);
    --hover: oklch(100% 0 0 / 0.07);
    --active: oklch(100% 0 0 / 0.11);
    --text: oklch(95% 0.002 279.3);
    --muted: oklch(71% 0.002 279.3);
    --accent: oklch(55% 0.15 248);
    --track: oklch(37% 0.004 275);
    --danger: oklch(74% 0.14 27.69);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    /* the window is the menu plus room for its shadow (TRAY_MENU.shadow) */
    padding: 16px;
    font: 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .menu {
    width: 264px;
    padding: 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: 0 8px 24px oklch(0% 0 0 / 0.45), 0 1px 3px oklch(0% 0 0 / 0.35);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 150ms cubic-bezier(0.16, 1, 0.3, 1), transform 150ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .menu.open { opacity: 1; transform: none; }
  /* it takes focus so the arrow keys work; Chromium would ring it in white
     every time it opens, since nothing was clicked yet */
  .menu:focus { outline: none; }
  @media (prefers-reduced-motion: reduce) { .menu { transform: none; } }
  .header { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px; }
  .header svg { width: 26px; height: 26px; flex: none; }
  .title { font-weight: 600; font-size: 14px; }
  .subtitle { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .item {
    display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px;
    border: 0; border-radius: 6px; background: transparent; color: inherit; font: inherit; text-align: left;
    cursor: default; outline: none; transition: background-color 100ms;
  }
  .item:hover, .item:focus-visible { background: var(--hover); }
  .item:active { background: var(--active); }
  .item svg.icon { width: 16px; height: 16px; flex: none; color: var(--muted); }
  .item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.quit:hover, .item.quit:focus-visible { color: var(--danger); }
  .item.quit:hover svg.icon, .item.quit:focus-visible svg.icon { color: var(--danger); }
  .switch { position: relative; width: 30px; height: 18px; flex: none; border-radius: 9px; background: var(--track); transition: background-color 100ms; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: white; transition: transform 150ms cubic-bezier(0.16, 1, 0.3, 1); }
  [aria-checked="true"] .switch { background: var(--accent); }
  [aria-checked="true"] .switch::after { transform: translateX(12px); }
  .separator { height: 1px; margin: 4px 6px; background: var(--border); }
</style>
</head>
<body>
<div class="menu" role="menu" aria-label="Overcord">
  <div class="header" aria-hidden="true">
    <svg viewBox="117.5 118 1020 1020"><g fill="#2b99e7"><path fill-rule="evenodd" clip-rule="evenodd" d="M508.2 396.1C497.5 387.5 474.9 243.3 426.5 242C362.7 240.4 202.7 317.3 179.2 379.3C165.8 414.8 180.7 463.1 197.6 494.9C239 573 293.4 446.2 314.3 418.3C358.4 359.1 369.4 411 371 428.2C371.3 432.2 369.9 433.9 366.4 435.9C246.5 505.6 203.7 612.9 198.8 747.3C198.7 750.8 197.2 752.9 193.7 753.2C178.2 754.5 160.8 744.9 144.4 748.7C99.9 759.1 153.9 823.4 166 847.2C167.6 850.4 166.8 853.2 163.7 854.8C150.6 861.4 130.2 862.6 157.9 902C199.8 961.6 275.4 1012 350 1013.5C358.7 1013.7 372.8 1011.5 377.8 1003.4C385.6 990.5 373.9 977.5 371.3 965.2C370.8 962.8 373.4 961.1 375.6 962C500.1 1010.1 566 1012.6 626.5 1012.6C687 1012.6 752.9 1010.1 877.4 962C879.6 961.1 882.2 962.8 881.7 965.2C879.1 977.5 867.4 990.5 875.2 1003.4C880.2 1011.5 894.3 1013.7 903 1013.5C977.6 1012 1053.2 961.6 1095.1 902C1122.8 862.6 1102.4 861.4 1089.3 854.8C1086.2 853.2 1085.4 850.4 1087 847.2C1099.1 823.4 1153.1 759.1 1108.6 748.7C1092.2 744.9 1074.8 754.5 1059.3 753.2C1055.8 752.9 1054.3 750.8 1054.2 747.2C1049.2 612.9 1006.4 505.5 886.5 435.9C883.1 433.9 881.7 432.2 882 428.2C883.6 411 894.6 359.1 938.7 418.3C959.6 446.2 1014 573 1055.4 494.9C1072.3 463.1 1087.2 414.8 1073.8 379.3C1050.3 317.3 890.3 240.4 826.5 242C781.9 243.2 759.2 366 747.5 391.8C746.4 394.2 743.2 394.2 741.6 392.1C727.7 374.8 707.6 349.5 690 343C679 339.3 673.9 353.3 672 371C671.7 373.1 669.2 374.2 667.5 372.9C637.4 348.6 596.6 311.3 566 296C552 291 543 310 538 345C536.3 362.5 538.3 376.1 537.9 387.9C537.7 391.8 536.4 393.6 532.8 394.8C525 397.4 512.7 399.7 508.2 396.1Z M446 615C484.2 615 518 667.8 518 735C518 790.9 487 833 446 833C405 833 374 790.9 374 735C374 667.8 407.8 615 446 615Z M807 615C845.2 615 879 667.8 879 735C879 790.9 848 833 807 833C766 833 735 790.9 735 735C735 667.8 768.8 615 807 615Z"/></g></svg>
    <div><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div></div>
  </div>
  <div id="items"></div>
</div>
<script>
  const ICONS = {
    open: 'M2.5 3.5h11v9h-11zM2.5 6h11',
    update: 'M13 8a5 5 0 1 1-1.46-3.54M13 2.5V5h-2.5',
    quit: 'M8 2v6M4.6 4.2a5 5 0 1 0 6.8 0',
    startAtLogin: 'M8 14A6 6 0 1 1 8 2a6 6 0 0 1 0 12ZM8 5v3.2l2.2 1.4',
  };
  const menu = document.querySelector('.menu');
  const list = document.getElementById('items');

  function icon(id) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('class', 'icon');
    svg.setAttribute('aria-hidden', 'true');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', ICONS[id] || '');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'currentColor');
    path.setAttribute('stroke-width', '1.4');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    svg.append(path);
    return svg;
  }

  function render(model) {
    document.getElementById('title').textContent = model.title;
    document.getElementById('subtitle').textContent = model.version;
    list.replaceChildren(...model.items.map((item) => {
      if (item.kind === 'separator') {
        const line = document.createElement('div');
        line.className = 'separator';
        line.setAttribute('role', 'separator');
        return line;
      }
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'item' + (item.id === 'quit' ? ' quit' : '');
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = item.label;
      if (item.kind === 'toggle') {
        button.setAttribute('role', 'menuitemcheckbox');
        button.setAttribute('aria-checked', String(item.checked));
        const toggle = document.createElement('span');
        toggle.className = 'switch';
        button.append(icon(item.id), label, toggle);
        button.addEventListener('click', () => {
          button.setAttribute('aria-checked', String(!item.checked));
          // let the switch move before the menu closes
          setTimeout(() => window.overcordTrayMenu.choose(item.id, !item.checked), 120);
        });
      } else {
        button.setAttribute('role', 'menuitem');
        button.append(icon(item.id), label);
        button.addEventListener('click', () => window.overcordTrayMenu.choose(item.id));
      }
      return button;
    }));
    menu.classList.remove('open');
    requestAnimationFrame(() => menu.classList.add('open'));
    menu.focus();
  }

  menu.tabIndex = -1;
  menu.addEventListener('keydown', (event) => {
    const items = [...list.querySelectorAll('.item')];
    const index = items.indexOf(document.activeElement);
    if (event.key === 'Escape') window.overcordTrayMenu.close();
    else if (event.key === 'ArrowDown') { event.preventDefault(); items[(index + 1) % items.length]?.focus(); }
    else if (event.key === 'ArrowUp') { event.preventDefault(); items[(index - 1 + items.length) % items.length]?.focus(); }
  });
  window.overcordTrayMenu.onRender(render);
</script>
</body>
</html>
